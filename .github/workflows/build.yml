name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Strict Project Unzip
        run: |
          unzip -qo "geeta-gyan-sketch (2).zip" -d .
          echo "=== Unzip Completed ==="
          ls -la

      - name: Setup Gradle and Build
        run: |
          # अगर gradlew फाइल नहीं है, तो खुद से gradle सेटअप करके बिल्ड करना
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d ./extracted_project
          echo "=== Unzip Completed ==="

      - name: Generate Wrapper, Keystore and Build APK
        run: |
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"

          # 1. Generate fresh gradle wrapper version 9.3.1
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

          # 2. Generate the release keystore file
          echo "Generating release keystore..."
          keytool -genkey -v -keystore my-upload-key.jks -storepass worldcam123 -alias worldcam_alias -keypass worldcam123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=WorldCamAI, OU=AI Studio, O=WorldCam, L=Kota, S=Rajasthan, C=IN"

          # 3. Exact target folder configuration (Fixing line 179-180 error)
          echo "Copying keystore directly inside the app folder where Gradle demands it..."
          mkdir -p app
          cp my-upload-key.jks app/my-upload-key.jks
          
          # Handling other daemon pathways just to be safe
          mkdir -p ~/.gradle/daemon/9.3.1/extracted_project
          cp my-upload-key.jks ~/.gradle/daemon/9.3.1/extracted_project/my-upload-key.jks
          mkdir -p /home/runner/extracted_project
          cp my-upload-key.jks /home/runner/extracted_project/my-upload-key.jks

          # 4. Inject global Gradle properties for release passwords
          echo "Injecting password credentials..."
          mkdir -p ~/.gradle
          echo "worldcam.release.store.password=worldcam123" >> ~/.gradle/gradle.properties
          echo "worldcam.release.key.password=worldcam123" >> ~/.gradle/gradle.properties

          # 5. Compile and build the Release APK with project arguments
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=my-upload-key.jks \
            -Pandroid.injected.signing.store.password=worldcam123 \
            -Pandroid.injected.signing.key.alias=worldcam_alias \
            -Pandroid.injected.signing.key.password=worldcam123 \
            -PstorePassword=worldcam123 \
            -PkeyPassword=worldcam123 \
            -x kspDebugKotlin -x kspReleaseKotlin -x validateSigningDebug
            
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/release/*.apk
            **/*.apk

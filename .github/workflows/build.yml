name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Strict Project Unzip
        run: |
          # ज़िप फाइल को पूरी तरह बाहर निकालना
          unzip -q "geeta-gyan-sketch (2).zip" -d .
          echo "=== Unzip Completed ==="
          ls -la
          
      - name: Grant Execute Permission and Build
        run: |
          # अनज़िप करने के बाद सही जगह पर जाकर परमिशन देना
          chmod +x gradlew || chmod +x **/gradlew
          ./gradlew assembleDebug
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

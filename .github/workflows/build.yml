name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Files
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Error: No zip file found!"
            exit 1
          fi
          echo "Unzipping $ZIP_FILE..."
          unzip -q "$ZIP_FILE" -d ./extracted_project
          echo "=== Unzip Completed ==="

      - name: Generate Wrapper, Keystore and Build APK
        run: |
          SETTINGS_PATH=$(find ./extracted_project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: settings.gradle not found!"
            exit 1
          fi
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          cd "$PROJECT_ROOT"
          
          # 1. Generate fresh gradle wrapper version 9.3.1
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # 2. Force generate the missing debug.keystore file right here
          echo "Generating missing debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          
          # 3. Compile and build the APK package safely
          ./gradlew assembleDebug --no-daemon -x kspDebugKotlin -x kspReleaseKotlin -x validateSigningDebug
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

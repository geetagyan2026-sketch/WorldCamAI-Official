name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Strict Project Unzip
        run: |
          unzip -qo "geeta-gyan-sketch (2).zip" -d .
          echo "=== Unzip Completed ==="
          ls -la

      - name: Fix Missing Files and Build
        run: |
          # खुद से gradle wrapper सेटअप करना
          gradle wrapper
          
          # मिसिंग google-services.json फ़ाइल को डमी डेटा के साथ बनाना ताकि एरर न आए
          mkdir -p app
          echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123"},"api_key":[{}]}]}' > app/google-services.json
          
          # मिसिंग debug.keystore फ़ाइल को ऑटो-जनरेट करना
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p app/debug
          cp ~/.android/debug.keystore app/debug.keystore || true
          
          # अब बिल्ड रन करना
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Strict Project Unzip
        run: |
          unzip -qo "geeta-gyan-sketch (2).zip" -d .
          echo "=== Unzip Completed ==="
          ls -la

      - name: Fix Missing Files and Build
        run: |
          # अगर अनजिप करने के बाद फाइल्स किसी सब-फोल्डर में हैं, तो वहाँ जाएँ
          if [ -f "gradlew" ]; then
            echo "Gradlew found in root"
          else
            SUBDIR=$(find . -maxdepth 2 -name "gradlew" -exec dirname {} \;)
            if [ ! -z "$SUBDIR" ]; then
              cd "$SUBDIR"
              echo "Moved to subdirectory: $SUBDIR"
            fi
          fi

          # Wrapper सेटअप
          chmod +x gradlew
          ./gradlew wrapper
          
          # Dummy google-services.json setup
          mkdir -p app
          echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.example.app"}}}]}' > app/google-services.json
          
          # Debug Keystore setup
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p app/debug
          cp ~/.android/debug.keystore app/debug/keystore.gradle || true
          
          # Clean and Build Debug APK
          ./gradlew clean assembleDebug --no-daemon
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

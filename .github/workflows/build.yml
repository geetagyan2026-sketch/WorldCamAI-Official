name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Code
        run: |
          unzip -q "geeta-gyan-sketch (2).zip" -d extracted_project || echo "Already unzipped"
          
      - name: Build APK with Gradle
        run: |
          if [ -d "extracted_project" ]; then cd extracted_project; fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk

name: Build Android APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project Code
        run: |
          mkdir -p extracted_project
          unzip -q "geeta-gyan-sketch (2).zip" -d extracted_project || true
          
      - name: Locate Project Root and Build
        run: |
          # सही फोल्डर ढूंढने का ऑटोमैटिक तरीका
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -z "$GRADLE_PATH" ]; then
            echo "Gradlew not found, generating wrapper..."
            gradle wrapper
            GRADLE_PATH="./gradlew"
          fi
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug || ./gradlew build --minus-gradle --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk

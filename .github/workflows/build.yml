name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Strict Project Unzip
        run: |
          unzip -qo "geeta-gyan-sketch (2).zip" -d .
          echo "=== Unzip Completed ==="

      - name: Fix Missing Files and Build
        run: |
          # मुख्य settings.gradle.kts या settings.gradle वाली लोकेशन ढूंढें
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          
          if [ -z "$SETTINGS_PATH" ]; then
            echo "Error: settings.gradle file not found anywhere!"
            exit 1
          fi
          
          PROJECT_ROOT=$(dirname "$SETTINGS_PATH")
          echo "True Project Root detected at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"

          # [फिक्स] यहाँ हम जबरदस्ती केवल वही Gradle 9.3.1 डाउनलोड करवा रहे हैं जो काम करता है
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          
          # आपके असली पैकेज नाम के साथ google-services.json सेटअप
          mkdir -p app
          echo '{"project_info":{"project_number":"123456789","project_id":"dummy-project-id"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.aistudio.worldcamai.kxmpzq"}},"api_key":[{"current_key":"dummy_api_key"}]}]}' > app/google-services.json
          
          # Debug Keystore setup
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          mkdir -p app/debug
          cp ~/.android/debug.keystore app/debug/keystore.gradle || true
          
          # आपके वर्ज़न 9.3.1 के साथ क्लीन बिल्ड रन करना
          ./gradlew clean assembleDebug --no-daemon
          echo "=== Build Completed ==="

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldCamAI-Official-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
